<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trokets – Bonecos Personalizados de Biscuit</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    /* ... (Todos os estilos anteriores se mantêm ativos) ... */
    :root { --cream: #DDC595; --cream-light: #F0E0BB; --cream-dark: #C8AA75; --green: #4D6E26; --green-dark: #3A5219; --green-light: #6A9435; --offwhite: #FAF5EC; --dark: #1C1C1C; --gray: #6B6B6B; --radius: 18px; --shadow: 0 4px 24px rgba(77,110,38,.13); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--offwhite); color: var(--dark); overflow-x: hidden; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 5%; background: rgba(250,245,236,.92); backdrop-filter: blur(12px); border-bottom: 2px solid var(--cream); }
    .nav-logo img { height: 52px; } .nav-links { display: flex; gap: 28px; list-style: none; } .nav-links a { text-decoration: none; font-weight: 700; color: var(--green); }
    .hero { min-height: 100vh; background: linear-gradient(135deg, var(--offwhite) 55%, var(--cream-light) 100%); display: flex; align-items: center; padding: 110px 5% 60px; gap: 40px; flex-wrap: wrap; }
    .btn-primary { background: var(--green); color: #fff; border: none; padding: 14px 32px; border-radius: 50px; text-decoration: none; display: inline-block; }
    .precos { padding: 80px 5%; background: var(--cream-light); } .precos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
    .preco-card { background: #fff; border-radius: var(--radius); padding: 32px 28px; }

    /* ===== ESTILOS ADICIONADOS PARA PAGAMENTO ===== */
    .info-section { padding: 80px 5%; background: var(--offwhite); }
    .info-section-header { margin-bottom: 48px; }
    .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 900px; }
    .info-card { background: #fff; border-radius: var(--radius); padding: 28px 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
    .info-card-icon { width: 48px; height: 48px; background: var(--cream-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .info-card-title { font-weight: 800; font-size: 1rem; color: var(--dark); }
    .info-card-desc { font-size: .88rem; color: var(--gray); line-height: 1.6; }
    .info-card-highlight { font-size: 1.8rem; font-weight: 900; color: var(--green); line-height: 1; }
  </style>
</head>
<body>
  <section class="info-section" id="info">
    <div class="info-section-header">
      <p class="section-label">✦ Como funciona</p>
      <h2 class="section-title">Pagamento & Prazo</h2>
    </div>
    <div class="info-cards">
      <div class="info-card">
        <div class="info-card-icon">⚡</div>
        <div class="info-card-title">Pix</div>
        <div class="info-card-desc">Confirme o pedido e pague na hora pelo Pix.</div>
      </div>
      <div class="info-card">
        <div class="info-card-icon">💳</div>
        <div class="info-card-title">Cartão</div>
        <div class="info-card-desc">Débito ou crédito. Parcele sem juros.</div>
      </div>
      <div class="info-card">
        <div class="info-card-icon">📦</div>
        <div class="info-card-title">Prazo de entrega</div>
        <div class="info-card-highlight">10–15</div>
        <div class="info-card-desc">dias úteis após a confirmação.</div>
      </div>
    </div>
  </section>

  <script>
    async function carregarVitrine() { console.log("Vitrine carregada"); }
    carregarVitrine();
  </script>
</body>
</html>
