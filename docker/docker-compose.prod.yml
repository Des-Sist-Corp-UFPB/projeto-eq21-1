# =============================================================================
# Docker Compose — PRODUÇÃO
# =============================================================================
#
# Em produção, a imagem Docker é construída pelo GitHub Actions e publicada
# no GHCR (GitHub Container Registry). Este arquivo usa a imagem pré-construída
# em vez de buildar no servidor — mais seguro, rápido e rastreável.
#
# CONFIGURAÇÃO — arquivo .env na raiz do projeto no servidor:
#
#   APP_IMAGE=ghcr.io/usuario/funko:latest   ← atualizado automaticamente pelo CI/CD
#   DB_USERNAME=eq21
#   DB_PASSWORD=<senha-forte-aqui>
#   MINIO_ACCESS_KEY=eq21
#   MINIO_SECRET=<chave-forte-aqui>
#   JWT_SECRET=<chave-jwt-forte-aqui>
#   JWT_EXPIRATION_MS=86400000
#
# PRIMEIRA EXECUÇÃO:
#   1. docker compose -f docker/docker-compose.prod.yml up -d postgres minio
#   2. Crie o bucket "eq21" no MinIO Console (http://localhost:9001)
#   3. docker compose -f docker/docker-compose.prod.yml up -d app
#
# ATUALIZAÇÕES subsequentes (feitas automaticamente pelo GitHub Actions):
#   APP_IMAGE=ghcr.io/usuario/funko:latest \
#   docker compose -f docker/docker-compose.prod.yml up -d --no-deps --force-recreate app
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: funko-postgres-prod
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_DB: eq21
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume nomeado — persiste os dados mesmo se o container for recriado.
      # NUNCA use bind mount (./data:...) em produção — dificulta backups e permissões.
      - postgres-prod-data:/var/lib/postgresql/data
    # Em produção, NÃO exponha o banco diretamente para o host.
    # O container da aplicação acessa via rede interna (funko-net).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d eq21"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - funko-net

  # ---------------------------------------------------------------------------
  # MinIO: armazenamento de imagens S3-compatível
  # Console: http://localhost:9001 (acesso local via SSH tunnel)
  # API interna: http://minio:9000
  # Na primeira execução, crie o bucket "eq21" pelo Console.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: funko-minio-prod
    env_file:
      - path: ../.env
        required: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - minio-prod-data:/data
    expose:
      - "9000"
    ports:
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - funko-net

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot
  #
  # Usa a imagem pré-construída pelo CI/CD (GitHub Actions).
  # A variável APP_IMAGE é atualizada automaticamente no .env a cada deploy.
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    container_name: funko-app-prod
    env_file:
      - path: ../.env
        required: true
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET: ${MINIO_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA}
    ports:
      - "127.0.0.1:8121:8121"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Healthcheck via Spring Actuator — o Docker considera o container saudável
    # somente quando a aplicação estiver pronta para receber requisições.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8121/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # Spring Boot precisa de até 60s para inicializar
    restart: unless-stopped
    networks:
      - funko-net

volumes:
  postgres-prod-data:
  minio-prod-data:

networks:
  funko-net:
    driver: bridge
