server:
  port: 8121

spring:
  application:
    name: eq21
  datasource:
    url: jdbc:postgresql://postgres:5432/eq21
    username: ${DB_USERNAME:eq21}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: ${openai.base-url}
      api-key: ${openai.api-key}
      chat:
        options:
          model: ${openai.model}

aws:
  s3:
    endpoint: http://minio:9000
    public-endpoint: https://s3.dsc.rodrigor.com
    region: us-east-1
    bucket: eq21
    access-key: ${MINIO_ACCESS_KEY:eq21}
    secret-key: ${MINIO_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

admin:
  email: ${ADMIN_EMAIL}
  senha: ${ADMIN_SENHA}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

openai:
  base-url: ${OPENAI_BASE_URL}
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}
